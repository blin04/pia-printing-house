<h2>Nova lozinka</h2>

@if (done) {
  <p style="color: green">{{ message }}</p>
  <button (click)="goToLogin()">Prijavi se</button>
} @else {
  Nova lozinka: <input type="password" [(ngModel)]="password" /> <br />
  <button (click)="submit()">Sačuvaj</button>

  @if (error) { <p style="color: red">{{ error }}</p> }
}
