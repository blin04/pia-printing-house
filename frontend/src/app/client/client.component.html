<header>
  <h1>Printing House</h1>
  <p class="user-blurb">Dobrodošli, {{ user.ime }} {{ user.prezime }} — klijent ({{ user.lice }})</p>
</header>

<nav>
  <div class="nav-links">
    <button [class.active]="view === 'profile'" (click)="setView('profile')">Profil</button>
    <button [class.active]="view === 'search'" (click)="setView('search')">Pretraga proizvoda</button>
    <button [class.active]="view === 'cart'" (click)="setView('cart')">E-korpa</button>
    <button [class.active]="view === 'archive'" (click)="setView('archive')">Arhiva</button>
    @if (user.lice === 'pravno') {
      <button [class.active]="view === 'nabavke'" (click)="setView('nabavke')">Javne nabavke</button>
    }
  </div>
  <div class="nav-actions">
    <button (click)="logout()">Izloguj se</button>
  </div>
</nav>

@switch (view) {
  @case ('profile') {
    <app-profile />
  }
  @case ('search') {
    <app-search />
  }
  @case ('cart') {
    <app-cart />
  }
  @case ('archive') {
    <app-archive />
  }
  @case ('nabavke') {
    <app-procurement />
  }
}

<footer>
  <p>© 2026 Printing House</p>
</footer>
