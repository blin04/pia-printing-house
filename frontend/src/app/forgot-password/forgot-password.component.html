<h2>Zaboravljena lozinka</h2>

Korisničko ime ili email: <input [(ngModel)]="identifier" /> <br />
<button (click)="submit()">Pošalji</button>
<button (click)="goToLogin()">Nazad na prijavu</button>

@if (error) { <p style="color: red">{{ error }}</p> }
